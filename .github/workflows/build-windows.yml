name: Build FileSafe Windows Desktop App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pefile==2024.8.26 capstone==5.0.9 PySide6_Essentials==6.12.0 shiboken6==6.12.0 reportlab==5.1.0 pytest==9.2.0 pyinstaller==6.22.3

      - name: Generate test fixtures & run pytest
        run: |
          python -m coalscan.fixtures.generate_fixtures
          python -m pytest -q

      - name: Build standalone Windows executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm coalscan.spec
          Compress-Archive -Path dist\coalscan\* -DestinationPath FileSafe-Windows-x64.zip

      - name: Upload FileSafe-Windows-x64.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileSafe-Windows-x64
          path: FileSafe-Windows-x64.zip

      - name: Create GitHub Release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FileSafe-Windows-x64.zip
          generate_release_notes: true
